<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/brand/iris-mark-backed-dark.svg" />
    <title>Iris</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #101215; }
      #root { min-height: 100vh; }
      .iris-static-splash { min-height: 100vh; display: grid; place-items: center; background: #101215; }
      .iris-static-splash::before { content: ""; width: 42px; height: 42px; border: 3px solid rgba(235, 178, 104, .25); border-top-color: #ebb268; border-radius: 50%; animation: iris-static-spin .8s linear infinite; }
      @keyframes iris-static-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="iris-static-splash" aria-label="Загрузка Iris"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
