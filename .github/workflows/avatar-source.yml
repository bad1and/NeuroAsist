name: Public avatar source boundary
on:
  pull_request:
  push:
    branches: [main, v0.9.1]
permissions:
  contents: read
jobs:
  source-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/avatar_assets.py check-public
