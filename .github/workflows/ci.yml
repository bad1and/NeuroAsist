name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt
      - name: Install locked Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python scripts/check_python_dependencies.py
      - name: Run backend regression suite
        run: python -m pytest -q

  web:
    name: Web tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Install package dependencies
        run: |
          npm ci
          npm ci --prefix apps/web
      - name: Run web tests
        run: npm --prefix apps/web test
      - name: Build web distribution
        run: npm --prefix apps/web run build

  desktop:
    name: Desktop Rust contract
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop package dependencies
        run: npm ci --prefix apps/desktop
      - name: Check desktop Rust shell
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
